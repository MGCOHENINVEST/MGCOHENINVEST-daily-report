name: validate

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax check (compileall)
        run: |
          python -m compileall -q scripts src || exit 1

      - name: Shell syntax check (bash -n)
        run: |
          set -e
          shopt -s nullglob
          for f in bin/*.sh scripts/*.sh; do
            bash -n "$f"
          done
